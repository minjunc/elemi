name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image already ships the Android SDK; just accept licenses so Gradle can fetch platform 36.
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install and sync web app
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      - name: Report build error
        if: failure()
        run: |
          msg=$(grep -v "^\s*at " gradle.log | grep -iE -A2 "error|aapt|what went wrong|failed" | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle build failed::$msg"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk elemi-tales.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elemi-tales-apk
          path: elemi-tales.apk

      # Keep a "latest" release so the APK can be downloaded straight from a phone.
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest elemi-tales.apk --title "엘레미 테일즈 (최신)" --notes "main 브랜치 ${GITHUB_SHA::7} 빌드. 폰에서 elemi-tales.apk 를 눌러 받아 설치하세요." --latest
